server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;

    # never cache the HTML so updates show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # cache the heavy media (gif/mp4/png) hard — they're versioned by the deploy
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
